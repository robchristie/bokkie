[workspace]
resolver = "3"
members = ["apps/bokkie-web", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/robchristie/bokkie"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Password hashing is slow by design; unoptimised it makes tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
