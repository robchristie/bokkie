[package]
name = "bokkie"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["apps/bokkie-attention-ui", "crates/bokkie-operator-api"]
resolver = "2"

[dependencies]
axum = "0.8.4"
bokkie-operator-api = { path = "crates/bokkie-operator-api" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.47", features = ["derive", "env"] }
cron = "0.15.0"
getrandom = "0.3.3"
libc = "0.2.175"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6.6", features = ["fs"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.21.0"
tower = "0.5.2"
