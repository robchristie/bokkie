[package]
name = "bokkie"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace]
members = ["apps/bokkie-attention-ui", "crates/bokkie-operator-api"]
resolver = "3"

[dependencies]
axum = "0.8.4"
base64 = "0.23.1"
bokkie-operator-api = { path = "crates/bokkie-operator-api" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.47", features = ["derive", "env"] }
cron = "0.15.0"
ece = "=2.4.2"
getrandom = "0.3.3"
hmac = "0.12.1"
# web-push's broad JWT range otherwise resolves crypto dependencies above our MSRV.
jwt-simple = { version = "=0.12.11", default-features = false, features = ["pure-rust"] }
libc = "0.2.175"
openssl = "0.10.75"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
subtle = "2.6.1"
# Keep jwt-simple's pure-Rust backend below its newer Rust 1.89 crypto graph.
superboring = "=0.1.4"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6.6", features = ["fs"] }
uuid = { version = "1.18.1", features = ["v4"] }
web-push = { version = "=0.11.0", default-features = false }

[dev-dependencies]
proptest = "=1.7.0"
tempfile = "3.21.0"
tower = "0.5.2"
aes-gcm = "0.10.3"
hkdf = "0.12.4"
