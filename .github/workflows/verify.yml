name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/codex
          key: codex-${{ hashFiles('deploy/codex-release.env') }}
      - name: Read the web client's tool versions
        id: web-tools
        run: scripts/fetch-stobie --versions >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/stobie
            .tools/wasm-bindgen
          key: web-tools-${{ runner.os }}-stobie-${{ steps.web-tools.outputs.stobie }}-wasm-bindgen-${{ steps.web-tools.outputs.wasm-bindgen }}
      # The browser smoke: the pinned Node, Playwright's Chromium (cached by
      # the Playwright version the lock names), its system libraries and Xvfb.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: tests/browser-smoke/.node-version
          cache: npm
          cache-dependency-path: tests/browser-smoke/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/browser-smoke/package-lock.json') }}
      - name: Install Chromium's system libraries and Xvfb
        run: |
          npm ci --prefix tests/browser-smoke --ignore-scripts --no-audit --no-fund
          tests/browser-smoke/node_modules/.bin/playwright install-deps chromium
          sudo apt-get install --yes xvfb
      - name: Verify
        run: scripts/verify
      - name: Keep the browser smoke's evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke
          path: .tools/runtime/browser-smoke
          retention-days: 14
          if-no-files-found: ignore
