name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Candidate code is read only. Jobs receive no write permission, repository
# secrets, deployment credentials or elevated execution privilege.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ""
  GITHUB_TOKEN: ""
  ACTIONS_RUNTIME_TOKEN: ""
  ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
  ACTIONS_ID_TOKEN_REQUEST_URL: ""

jobs:
  plan-governance:
    name: Plan governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        # actions/checkout v7.0.1: official verified Node 24 release commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test and lint repository contracts
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/plan_lint.py
          python3 tools/toolchain_contract.py

  backend:
    name: Locked backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - name: Check out candidate
        # actions/checkout v7.0.1: official verified Node 24 release commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN-}${GITHUB_TOKEN-}${ACTIONS_RUNTIME_TOKEN-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN-}${ACTIONS_ID_TOKEN_REQUEST_URL-}"
          if git config --local --name-only --get-regexp \
            '(^|\.)(extraheader|credentialhelper|credential\.helper)$' \
            >/dev/null 2>&1; then
            echo "checkout authentication configuration remains" >&2
            exit 1
          fi

      - name: Install exact backend toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUSTUP_TOOLCHAIN" clippy rustfmt

      - name: Test
        run: cargo test --all-targets --locked

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  attention-ui:
    name: Locked attention UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Check out candidate
        # actions/checkout v7.0.1: official verified Node 24 release commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact UI toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUSTUP_TOOLCHAIN" clippy rustfmt
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" wasm32-unknown-unknown

      - name: Test, lint and build native and Wasm contracts
        run: tools/check-ui.sh
