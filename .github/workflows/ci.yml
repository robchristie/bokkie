name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Candidate code is read only. Jobs receive no write permission, repository
# secrets, deployment credentials or elevated execution privilege.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ""
  GITHUB_TOKEN: ""
  ACTIONS_RUNTIME_TOKEN: ""
  ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
  ACTIONS_ID_TOKEN_REQUEST_URL: ""

jobs:
  plan-governance:
    name: Plan governance
    # Noble's default AppArmor user-namespace policy denies Bubblewrap's
    # loopback setup. Select a compatible hosted image without changing that
    # host policy or sharing the observer's network namespace. Replace Jammy
    # before its announced retirement on 17 April 2027:
    # https://github.com/actions/runner-images/issues/14254
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        # actions/checkout v7.0.1: official verified Node 24 release commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up contract Python
        # actions/setup-python v7.0.0: official verified immutable release.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          # Preserve the contract runtime used on Noble; Jammy defaults to 3.10.
          python-version: '3.12'

      - name: Prepare confined host observer tests
        # Install Jammy's signed security build with descriptor-based mounts.
        # Host observer regressions must exercise the actual isolation boundary.
        # A version number alone does not establish a backported capability.
        # Keep this public repository on its authored GitHub-hosted route.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          python3 - <<'PY'
          import subprocess
          help_text = subprocess.run(['/usr/bin/bwrap', '--help'], check=True, capture_output=True, text=True).stdout
          if '--ro-bind-fd' not in help_text:
              raise SystemExit('Bubblewrap descriptor-based read-only mounts are required')
          PY
          # Exercise the actual minimal Git boundary before the full contract
          # suite. A help flag alone cannot establish namespace/mount readiness;
          # failed fixtures print bounded trusted-helper diagnostics.
          PYTHONPATH=tools/workspace-runtime python3 -m unittest -v \
            test_runtime.SafeGitEarlyTests.test_fsmonitor_command_is_never_executed_by_host_observation \
            test_runtime.SafeGitEarlyTests.test_assume_unchanged_cannot_hide_dirty_tracked_source \
            test_runtime.SafeGitEarlyTests.test_real_linked_worktree_has_the_same_clean_commit_identity

      - name: Test and lint repository contracts
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/plan_lint.py
          python3 tools/toolchain_contract.py

  backend:
    name: Locked backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - name: Check out candidate
        # actions/checkout v7.0.1: official verified Node 24 release commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN-}${GITHUB_TOKEN-}${ACTIONS_RUNTIME_TOKEN-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN-}${ACTIONS_ID_TOKEN_REQUEST_URL-}"
          if git config --local --name-only --get-regexp \
            '(^|\.)(extraheader|credentialhelper|credential\.helper)$' \
            >/dev/null 2>&1; then
            echo "checkout authentication configuration remains" >&2
            exit 1
          fi

      - name: Install exact backend toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUSTUP_TOOLCHAIN" clippy rustfmt

      - name: Install pinned Nextest binary
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
          checksum: true
          fallback: none

      - name: Test
        run: |
          rm -f -- .bokkie/nextest/backend-ci/junit.xml
          cargo nextest show-config version
          cargo nextest run --all-targets --locked --profile backend-ci
          cargo test --doc --locked

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bokkie-backend-test-results
          path: .bokkie/nextest/backend-ci/junit.xml
          include-hidden-files: true
          if-no-files-found: warn

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  attention-ui:
    name: Locked attention UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - name: Check out candidate
        # actions/checkout v7.0.1: official verified Node 24 release commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact UI toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUSTUP_TOOLCHAIN" clippy rustfmt
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" wasm32-unknown-unknown

      - name: Install pinned Nextest binary
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
          checksum: true
          fallback: none

      - name: Test, lint and build native and Wasm contracts
        run: tools/check-ui.sh

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bokkie-attention-ui-test-results
          path: .bokkie/nextest/ui-ci/junit.xml
          include-hidden-files: true
          if-no-files-found: warn

  authenticated-web-shell:
    name: Authenticated manifest and worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install locked browser fixture
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Prepare immutable public fixture images
        # Docker's verified public ECR images serve the same pinned manifests.
        # Avoid Docker Hub's shared anonymous quota without adding credentials.
        # Keep pulls sequential for ECR's anonymous request quota.
        run: |
          docker pull public.ecr.aws/docker/library/nginx@sha256:e7257f1ef28ba17cf7c248cb8ccf6f0c6e0228ab9c315c152f9c203cd34cf6d1
          docker pull public.ecr.aws/docker/library/node@sha256:7af03b14a13c8cdd38e45058fd957bf00a72bbe17feac43b1c15a689c029c732
          echo "BOKKIE_AUTH_NGINX_IMAGE=$(docker image inspect --format '{{.Id}}' public.ecr.aws/docker/library/nginx@sha256:e7257f1ef28ba17cf7c248cb8ccf6f0c6e0228ab9c315c152f9c203cd34cf6d1)" >> "$GITHUB_ENV"
          echo "BOKKIE_AUTH_RUNTIME_IMAGE=$(docker image inspect --format '{{.Id}}' public.ecr.aws/docker/library/node@sha256:7af03b14a13c8cdd38e45058fd957bf00a72bbe17feac43b1c15a689c029c732)" >> "$GITHUB_ENV"

      - name: Qualify fresh authentication and worker updates through nginx
        run: node tools/ui-authenticated-push.mjs
