<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <!-- egui scales itself, so page zoom is off. viewport-fit=cover gives the
         page the whole screen; #app-shell keeps clear of the safe areas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Bokkie</title>
    <!-- The installable application. `stobie build-web` writes
         manifest.webmanifest and sw.js from these tags, and fails the build
         when one it needs is missing: the title names the application,
         apple-mobile-web-app-title gives its short name, theme-color its
         colour, stobie-background-color the splash screen's and the icon
         links its icons. scripts/render-icons draws the icons from
         apps/bokkie-web/icons/bokkie.svg. -->
    <meta name="description" content="A private household assistant: chat with your Bots." />
    <meta name="apple-mobile-web-app-title" content="Bokkie" />
    <meta name="theme-color" content="#295b50" />
    <meta name="stobie-background-color" content="#f5f1e9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Web Push: the service worker shows each push the gateway sends and
         routes a tapped notification back into the application, which
         opens the Bot it names. -->
    <meta name="stobie-web-push" content="enabled" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- The licences of the fonts the application embeds. -->
    <link rel="license" href="third-party-notices.txt" />
    <style>
      /* The shell follows the identity: the theme colour behind the
         application, where the safe areas show it, and the splash screen's
         background and the theme colour while it starts. The application
         is light or dark as the system is, and so is the page around it. */
      :root {
        color-scheme: light dark; background: #295b50; font-family: system-ui, sans-serif;
        /* The startup loader keeps these at the visual viewport's size, so the
           shell stays above an on-screen keyboard. */
        --stobie-viewport-height: 100dvh; --stobie-viewport-top: 0px;
        --stobie-bottom-inset: env(safe-area-inset-bottom, 0px);
      }
      html, body {
        position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
        background: #295b50; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
      }
      #app-shell {
        position: fixed;
        left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
        top: calc(var(--stobie-viewport-top) + env(safe-area-inset-top, 0px));
        height: calc(var(--stobie-viewport-height) - env(safe-area-inset-top, 0px) - var(--stobie-bottom-inset));
      }
      #app-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #295b50; background: #f5f1e9; }
      /* Dark, the loader takes the dark theme's panel colour. */
      @media (prefers-color-scheme: dark) { #loading { color: #f5f1e9; background: #13181d; } }
      body.ready #loading { display: none; }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <canvas id="app-canvas" aria-label="Bokkie"></canvas>
    </div>
    <div id="loading" role="status">Starting Bokkie…</div>
    <script type="module" src="bootstrap.js"></script>
  </body>
</html>
