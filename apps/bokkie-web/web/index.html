<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- egui scales itself, so page zoom is off. viewport-fit=cover gives the
         page the whole screen; #app-shell keeps clear of the safe areas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Bokkie Web</title>
    <!-- The installable application. `stobie build-web` writes
         manifest.webmanifest and sw.js from these tags: the title names the
         application, apple-mobile-web-app-title gives its short name,
         theme-color its colour and the icon links its icons. -->
    <meta name="apple-mobile-web-app-title" content="Bokkie Web" />
    <meta name="theme-color" content="#0b0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- The licences of the fonts the application embeds. -->
    <link rel="license" href="third-party-notices.txt" />
    <style>
      :root {
        color-scheme: dark; background: #0b0f12; font-family: system-ui, sans-serif;
        /* The startup loader keeps these at the visual viewport's size, so the
           shell stays above an on-screen keyboard. */
        --stobie-viewport-height: 100dvh; --stobie-viewport-top: 0px;
        --stobie-bottom-inset: env(safe-area-inset-bottom, 0px);
      }
      html, body {
        position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
        background: #0b0f12; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
      }
      #app-shell {
        position: fixed;
        left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
        top: calc(var(--stobie-viewport-top) + env(safe-area-inset-top, 0px));
        height: calc(var(--stobie-viewport-height) - env(safe-area-inset-top, 0px) - var(--stobie-bottom-inset));
      }
      #app-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #9eb0b8; background: #0b0f12; }
      body.ready #loading { display: none; }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <canvas id="app-canvas" aria-label="Bokkie Web"></canvas>
    </div>
    <div id="loading" role="status">Starting Bokkie Web…</div>
    <script type="module" src="bootstrap.js"></script>
  </body>
</html>
