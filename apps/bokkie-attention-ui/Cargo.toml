[package]
name = "bokkie-attention-ui"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bokkie-attention-ui"
path = "src/main.rs"

[dependencies]
bokkie-operator-api = { path = "../../crates/bokkie-operator-api" }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu"] }
ehttp = { version = "0.7.1", features = ["json"] }
polyorama-core = { git = "https://github.com/robchristie/polyorama", rev = "0e725f5a97a6d99a6bc4c961dfc05b4e9252ba1d" }
polyorama-ui-egui = { git = "https://github.com/robchristie/polyorama", rev = "0e725f5a97a6d99a6bc4c961dfc05b4e9252ba1d" }
percent-encoding = "2.3.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["wayland", "x11"] }
url = "2.5.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
log = "0.4.28"
wasm-bindgen = "0.2.103"
wasm-bindgen-futures = "0.4.53"
web-sys = { version = "0.3.80", features = ["HtmlCanvasElement"] }
