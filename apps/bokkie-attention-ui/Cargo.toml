[package]
name = "bokkie-attention-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bokkie-attention-ui"
path = "src/main.rs"

[dependencies]
bokkie-operator-api = { path = "../../crates/bokkie-operator-api" }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu"] }
ehttp = { version = "0.7.1", features = ["json"] }
polyorama-core = { git = "https://github.com/robchristie/polyorama", rev = "25a7eb1184c1fd6b614b3e3b2b23ccb5c458d45f" }
polyorama-ui-egui = { git = "https://github.com/robchristie/polyorama", rev = "25a7eb1184c1fd6b614b3e3b2b23ccb5c458d45f" }
percent-encoding = "2.3.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["wayland", "x11"] }
url = "2.5.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.80"
log = "0.4.28"
wasm-bindgen = "0.2.103"
wasm-bindgen-futures = "0.4.53"
serde-wasm-bindgen = "0.6.5"
web-sys = { version = "0.3.80", features = ["HtmlCanvasElement"] }
