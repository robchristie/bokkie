[package]
name = "bokkie-mock-model"
description = "Stand-ins for the OpenAI Responses API and for ChatGPT's sign-in authority and backend, for tests and the browser smoke: a real Codex app server holds a synthetic sign-in and runs turns without any request reaching OpenAI"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# Test-only. No production crate depends on it: the gateway takes it as a
# development dependency, and its binary serves only the browser smoke.
[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
