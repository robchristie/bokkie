[package]
name = "bokkie-mock-model"
description = "A stand-in for the OpenAI Responses API, for tests and the browser smoke: a real Codex app server runs turns against it without signing in or calling a model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# Test-only. No production crate depends on it: the gateway takes it as a
# development dependency, and its binary serves only the browser smoke.
[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }

[lints]
workspace = true
