[package]
name = "bokkie-qualify"
description = "Phase 0 qualification probe for the Codex app server and sandbox in a container"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "bokkie-qualify"
path = "src/main.rs"

[[bin]]
name = "bokkie-sandbox-probe"
path = "src/bin/bokkie-sandbox-probe.rs"

[dependencies]
bokkie-codex = { path = "../bokkie-codex" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[lints]
workspace = true
